<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台通知测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        button {
            background: #007AFF;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
        }
        button:hover {
            background: #0051D5;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .status {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        .status.warning {
            background: #fff3cd;
            color: #856404;
        }
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }
        h2 {
            margin-top: 0;
            color: #333;
        }
        .step {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #2196F3;
        }
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔔 后台通知测试工具</h2>
        <p>这个页面用来测试：<strong>页面在后台/锁屏时，能否收到系统通知</strong></p>
        
        <div id="permission-status"></div>
        
        <button id="request-permission" onclick="requestPermission()">1️⃣ 请求通知权限</button>
        <button id="test-immediate" onclick="testImmediateNotification()" disabled>2️⃣ 测试立即通知</button>
        <button id="test-delayed" onclick="testDelayedNotification()" disabled>3️⃣ 测试延迟通知（10秒后）</button>
        <button id="test-background" onclick="testBackgroundNotification()" disabled>4️⃣ 测试后台通知</button>
    </div>

    <div class="card">
        <h2>📋 测试步骤</h2>
        <div class="step">
            <strong>步骤 1:</strong> 点击"请求通知权限"按钮，授予权限
        </div>
        <div class="step">
            <strong>步骤 2:</strong> 点击"测试立即通知"，应该立即看到通知
        </div>
        <div class="step">
            <strong>步骤 3:</strong> 点击"测试延迟通知"，然后：
            <ul>
                <li>🔒 <strong>立即锁屏</strong>（或切换到其他应用）</li>
                <li>⏰ 等待 10 秒</li>
                <li>✅ 应该在锁屏/其他应用时收到通知</li>
            </ul>
        </div>
        <div class="step">
            <strong>步骤 4:</strong> 点击"测试后台通知"，然后：
            <ul>
                <li>🔒 <strong>立即切换到其他应用或锁屏</strong></li>
                <li>✅ 应该立即收到通知</li>
            </ul>
        </div>
    </div>

    <div class="card">
        <h2>📊 系统状态</h2>
        <div id="system-status"></div>
    </div>

    <div class="card">
        <h2>📝 日志</h2>
        <div id="log" style="max-height: 300px; overflow-y: auto;"></div>
    </div>

    <script>
        // 日志系统
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            const colors = {
                info: '#0c5460',
                success: '#155724',
                error: '#721c24',
                warning: '#856404'
            };
            logDiv.innerHTML = `<div style="color: ${colors[type]}; margin-bottom: 8px;">
                [${time}] ${message}
            </div>` + logDiv.innerHTML;
            console.log(`[${time}] ${message}`);
        }

        // 更新权限状态
        function updatePermissionStatus() {
            const statusDiv = document.getElementById('permission-status');
            const permission = Notification.permission;
            
            let html = '';
            let statusClass = '';
            
            switch (permission) {
                case 'granted':
                    html = '✅ <strong>通知权限已授予</strong> - 可以开始测试了！';
                    statusClass = 'success';
                    document.getElementById('test-immediate').disabled = false;
                    document.getElementById('test-delayed').disabled = false;
                    document.getElementById('test-background').disabled = false;
                    break;
                case 'denied':
                    html = '❌ <strong>通知权限被拒绝</strong> - 请在浏览器设置中手动开启';
                    statusClass = 'error';
                    break;
                default:
                    html = '⚠️ <strong>尚未请求通知权限</strong> - 请点击下方按钮';
                    statusClass = 'warning';
            }
            
            statusDiv.innerHTML = `<div class="status ${statusClass}">${html}</div>`;
            updateSystemStatus();
        }

        // 请求通知权限
        async function requestPermission() {
            log('正在请求通知权限...', 'info');
            
            if (!('Notification' in window)) {
                log('❌ 浏览器不支持通知功能', 'error');
                alert('您的浏览器不支持通知功能');
                return;
            }
            
            try {
                const permission = await Notification.requestPermission();
                log(`通知权限结果: ${permission}`, permission === 'granted' ? 'success' : 'error');
                updatePermissionStatus();
                
                if (permission === 'granted') {
                    log('✅ 通知权限已授予！可以开始测试了', 'success');
                }
            } catch (error) {
                log(`❌ 请求权限失败: ${error.message}`, 'error');
            }
        }

        // 发送通知
        function sendNotification(title, body, tag) {
            if (Notification.permission !== 'granted') {
                log('❌ 通知权限未授予，无法发送通知', 'error');
                return null;
            }
            
            try {
                log(`📤 正在发送通知: ${title}`, 'info');
                
                const notification = new Notification(title, {
                    body: body,
                    icon: 'https://i.postimg.cc/PxZrFFFL/o-o-1.jpg',
                    tag: tag || 'test-notification',
                    requireInteraction: false,
                    silent: false
                });
                
                notification.onclick = function() {
                    log('👆 用户点击了通知', 'success');
                    window.focus();
                    notification.close();
                };
                
                notification.onshow = function() {
                    log('✅ 通知已显示', 'success');
                };
                
                notification.onerror = function(error) {
                    log(`❌ 通知显示失败: ${error}`, 'error');
                };
                
                // 10秒后自动关闭
                setTimeout(() => {
                    notification.close();
                    log('通知已自动关闭', 'info');
                }, 10000);
                
                return notification;
            } catch (error) {
                log(`❌ 发送通知失败: ${error.message}`, 'error');
                return null;
            }
        }

        // 测试立即通知
        function testImmediateNotification() {
            log('🧪 测试 1: 立即通知', 'info');
            sendNotification(
                '立即通知测试',
                '如果你看到这条通知，说明立即通知功能正常！',
                'test-immediate'
            );
        }

        // 测试延迟通知
        function testDelayedNotification() {
            log('🧪 测试 2: 延迟通知（10秒后）', 'info');
            log('⚠️ 请立即锁屏或切换到其他应用！', 'warning');
            
            let countdown = 10;
            const intervalId = setInterval(() => {
                log(`⏰ 倒计时: ${countdown} 秒`, 'info');
                countdown--;
                
                if (countdown < 0) {
                    clearInterval(intervalId);
                }
            }, 1000);
            
            setTimeout(() => {
                log('📤 10秒已到，发送通知...', 'info');
                sendNotification(
                    '延迟通知测试',
                    '如果你在锁屏/其他应用看到这条通知，说明后台通知功能正常！',
                    'test-delayed'
                );
            }, 10000);
        }

        // 测试后台通知（检测页面可见性）
        function testBackgroundNotification() {
            log('🧪 测试 3: 后台通知（检测页面隐藏）', 'info');
            log('⚠️ 请立即切换到其他应用或锁屏！', 'warning');
            
            // 监听页面可见性变化
            const visibilityHandler = function() {
                if (document.hidden) {
                    log('✅ 检测到页面已隐藏，2秒后发送通知...', 'success');
                    
                    setTimeout(() => {
                        sendNotification(
                            '后台通知测试',
                            '页面在后台时发送的通知。如果你收到这条通知，说明功能完全正常！',
                            'test-background'
                        );
                        
                        // 移除监听器
                        document.removeEventListener('visibilitychange', visibilityHandler);
                    }, 2000);
                }
            };
            
            document.addEventListener('visibilitychange', visibilityHandler);
            
            // 30秒后如果用户没有隐藏页面，取消测试
            setTimeout(() => {
                document.removeEventListener('visibilitychange', visibilityHandler);
                log('⚠️ 30秒内未检测到页面隐藏，测试已取消', 'warning');
            }, 30000);
        }

        // 更新系统状态
        function updateSystemStatus() {
            const statusDiv = document.getElementById('system-status');
            const status = {
                permission: Notification.permission,
                hidden: document.hidden,
                online: navigator.onLine,
                userAgent: navigator.userAgent
            };
            
            statusDiv.innerHTML = `<pre>${JSON.stringify(status, null, 2)}</pre>`;
        }

        // 页面加载时
        window.addEventListener('load', () => {
            log('🚀 后台通知测试工具已加载', 'success');
            updatePermissionStatus();
            
            // 监听页面可见性变化
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    log('📱 页面已隐藏（后台）', 'info');
                } else {
                    log('📱 页面已显示（前台）', 'info');
                }
                updateSystemStatus();
            });
            
            // 每5秒更新一次状态
            setInterval(updateSystemStatus, 5000);
        });
    </script>
</body>
</html>
